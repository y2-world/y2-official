services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: y2-official-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    ports:
      - "8080:80"
    networks:
      - y2-network
    depends_on:
      - postgres
      - redis
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=y2_official
      - DB_USERNAME=y2user
      - DB_PASSWORD=y2password
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  postgres:
    image: postgres:16
    container_name: y2-official-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: y2_official
      POSTGRES_USER: y2user
      POSTGRES_PASSWORD: y2password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - y2-network

  redis:
    image: redis:alpine
    container_name: y2-official-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - y2-network

networks:
  y2-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
